repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.0
    hooks:
      # Update the uv lockfile
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.0
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
  - repo: local
    hooks:
      # Type check, as CI does. pre-commit.ci skips this, as it can't run system hooks.
      - id: mypy
        name: mypy
        # Sync dependencies without building the package: a build rewrites
        # __version__, and pre-commit fails a hook that changes files. --frozen installs
        # uv.lock as is (uv-lock runs first), so the sync never rewrites that either.
        entry: sh -c 'uv sync --quiet --frozen --inexact --no-install-project && uv run --no-sync mypy pyweatherflowudp'
        language: system
        # Python code, mypy's settings (setup.cfg) and version, and this hook's own config
        files: ^(pyweatherflowudp/|pyproject\.toml$|setup\.cfg$|uv\.lock$|\.pre-commit-config\.yaml$)
        pass_filenames: false

ci:
  skip: [mypy]
